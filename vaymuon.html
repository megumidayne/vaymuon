<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Megumi Ghi Nợ Mini</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #1e1b4b, #312e81); min-height: 100vh; font-family: sans-serif; }
        .glass { background: rgba(255,255,255,0.12); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.2); }
        .glass-card { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); }
        input, select { background: rgba(255,255,255,0.9) !important; color: #000 !important; }
    </style>
</head>
<body class="text-white p-4 max-w-4xl mx-auto space-y-4">

    <!-- HEADER -->
    <div class="glass rounded-2xl p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">💳 MEGUMI GHI NỢ</h1>
        <button onclick="exportData()" class="glass-card px-3 py-1.5 rounded-xl text-xs font-semibold hover:bg-white hover:text-indigo-900">📥 Xuất Data</button>
    </div>

    <!-- THỐNG KÊ -->
    <div class="grid grid-cols-3 gap-3 text-center">
        <div class="glass rounded-xl p-3"><p class="text-xs text-indigo-200">Thu về</p><h2 id="totalReceivable" class="text-lg font-bold text-emerald-400">0 ₫</h2></div>
        <div class="glass rounded-xl p-3"><p class="text-xs text-indigo-200">Trả đi</p><h2 id="totalPayable" class="text-lg font-bold text-rose-400">0 ₫</h2></div>
        <div class="glass rounded-xl p-3"><p class="text-xs text-indigo-200">Dư nợ</p><h2 id="netBalance" class="text-lg font-bold text-amber-300">0 ₫</h2></div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- FORM NHẬP -->
        <form id="debtForm" onsubmit="addDebt(event)" class="glass rounded-2xl p-4 space-y-3">
            <h3 class="font-bold text-sm border-b border-white/20 pb-2">📝 Thêm giao dịch</h3>
            <select id="type" class="w-full p-2 rounded-xl text-xs font-bold">
                <option value="receivable">Cho vay (Thu về)</option>
                <option value="payable">Đi vay (Trả đi)</option>
            </select>
            <input type="text" id="person" required placeholder="Tên người vay/cho vay" class="w-full p-2 rounded-xl text-xs">
            <input type="number" id="amount" required min="1000" placeholder="Số tiền (VNĐ)" class="w-full p-2 rounded-xl text-xs font-bold">
            <input type="text" id="note" placeholder="Ghi chú (Không bắt buộc)" class="w-full p-2 rounded-xl text-xs">
            <button type="submit" class="w-full bg-indigo-500 hover:bg-indigo-600 font-bold py-2 rounded-xl text-xs transition">+ Lưu</button>
        </form>

        <!-- DANH SÁCH -->
        <div class="md:col-span-2 glass rounded-2xl p-4 space-y-3">
            <div class="flex justify-between items-center gap-2">
                <input type="text" id="searchInput" oninput="render()" placeholder="🔍 Tìm kiếm..." class="w-full p-2 rounded-xl text-xs">
                <select id="filterSelect" onchange="render()" class="p-2 rounded-xl text-xs font-bold min-w-[90px]">
                    <option value="all">Tất cả</option>
                    <option value="receivable">Cho vay</option>
                    <option value="payable">Đi vay</option>
                </select>
            </div>
            <div id="debtList" class="space-y-2 max-h-[320px] overflow-y-auto"></div>
        </div>
    </div>

    <script>
        let debts = JSON.parse(localStorage.getItem('megumi_debts')) || [];

        const fmt = num => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(num);

        function save() {
            localStorage.setItem('megumi_debts', JSON.stringify(debts));
            render();
        }

        function addDebt(e) {
            e.preventDefault();
            debts.unshift({
                id: Date.now(),
                type: document.getElementById('type').value,
                person: document.getElementById('person').value.trim(),
                amount: parseFloat(document.getElementById('amount').value),
                note: document.getElementById('note').value.trim(),
                status: 'pending'
            });
            e.target.reset();
            save();
        }

        function toggleStatus(id) {
            debts = debts.map(d => d.id === id ? { ...d, status: d.status === 'pending' ? 'paid' : 'pending' } : d);
            save();
        }

        function deleteDebt(id) {
            if (confirm('Xóa khoản này?')) { debts = debts.filter(d => d.id !== id); save(); }
        }

        function render() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filter = document.getElementById('filterSelect').value;

            let rec = 0, pay = 0;
            debts.forEach(d => {
                if (d.status === 'pending') {
                    if (d.type === 'receivable') rec += d.amount; else pay += d.amount;
                }
            });

            document.getElementById('totalReceivable').innerText = fmt(rec);
            document.getElementById('totalPayable').innerText = fmt(pay);
            document.getElementById('netBalance').innerText = fmt(rec - pay);

            const filtered = debts.filter(d => 
                (filter === 'all' || d.type === filter) &&
                (d.person.toLowerCase().includes(search) || d.note.toLowerCase().includes(search))
            );

            const listEl = document.getElementById('debtList');
            if (!filtered.length) {
                listEl.innerHTML = `<div class="text-center py-4 text-xs text-indigo-200">Không có dữ liệu</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(d => `
                <div class="glass-card rounded-xl p-2.5 flex items-center justify-between text-xs ${d.status === 'paid' ? 'opacity-40' : ''}">
                    <div class="flex items-center gap-2">
                        <button onclick="toggleStatus(${d.id})" class="w-5 h-5 rounded border border-white/50 flex items-center justify-center font-bold ${d.status === 'paid' ? 'bg-emerald-500 text-white border-none' : ''}">
                            ${d.status === 'paid' ? '✓' : ''}
                        </button>
                        <div>
                            <div class="font-bold ${d.status === 'paid' ? 'line-through' : ''}">${d.person} <span class="text-[10px] px-1 rounded ${d.type === 'receivable' ? 'bg-emerald-500/30' : 'bg-rose-500/30'}">${d.type === 'receivable' ? 'Cho vay' : 'Đi vay'}</span></div>
                            <div class="text-[11px] text-indigo-100">${d.note || 'Không ghi chú'}</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="font-bold ${d.type === 'receivable' ? 'text-emerald-300' : 'text-rose-300'} ${d.status === 'paid' ? 'line-through' : ''}">
                            ${d.type === 'receivable' ? '+' : '-'}${fmt(d.amount)}
                        </div>
                        <button onclick="deleteDebt(${d.id})" class="text-[10px] text-rose-300 hover:underline">Xóa</button>
                    </div>
                </div>
            `).join('');
        }

        function exportData() {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([JSON.stringify(debts, null, 2)], { type: 'application/json' }));
            a.download = `megumi-ghi-no.json`;
            a.click();
        }

        render();
    </script>
</body>
</html>
